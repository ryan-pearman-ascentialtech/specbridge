<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpecBridge — BEP Installation Procurement</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
      --accent: #4f7cff; --accent-hover: #3d6aed;
      --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
      --text: #e2e8f0; --muted: #64748b; --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }

    /* ── NAV ── */
    nav { display: flex; align-items: center; gap: 8px; padding: 0 24px; height: 52px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-size: 17px; font-weight: 700; margin-right: 12px; letter-spacing: -0.3px; }
    .nav-logo span { color: var(--accent); }
    .nav-divider { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
    .nav-link { color: var(--muted); text-decoration: none; font-size: 13px; padding: 5px 10px; border-radius: 5px; cursor: pointer; background: none; border: none; font-family: var(--font); transition: all 0.15s; }
    .nav-link:hover, .nav-link.active { color: var(--text); background: var(--border); }
    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .breadcrumb { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .breadcrumb-sep { color: var(--border); }
    .breadcrumb-link { color: var(--accent); cursor: pointer; }
    .breadcrumb-link:hover { text-decoration: underline; }

    /* ── LAYOUT ── */
    .page { display: none; }
    .page.active { display: block; }
    .container { max-width: 1140px; margin: 0 auto; padding: 28px 24px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }

    /* ── BUTTONS ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: background 0.15s; font-family: var(--font); }
    .btn-primary   { background: var(--accent); color: #fff; }
    .btn-primary:hover   { background: var(--accent-hover); }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-secondary:hover { background: #363946; }
    .btn-success   { background: #16a34a; color: #fff; }
    .btn-success:hover   { background: #15803d; }
    .btn-warning   { background: #b45309; color: #fff; }
    .btn-warning:hover   { background: #92400e; }
    .btn-ghost     { background: transparent; color: var(--accent); border: 1px solid var(--border); }
    .btn-ghost:hover     { background: var(--border); }
    .btn-teal      { background: #0f766e; color: #fff; }
    .btn-teal:hover      { background: #0d6561; }
    .btn-sm  { padding: 5px 12px; font-size: 12px; }
    .btn-xs  { padding: 3px 9px; font-size: 11px; border-radius: 5px; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── FORMS ── */
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 12px; color: var(--muted); font-weight: 500; }
    label.req::after { content: ' *'; color: var(--danger); }
    input, textarea, select { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; padding: 8px 10px; width: 100%; font-family: var(--font); transition: border-color 0.15s; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    textarea { resize: vertical; min-height: 60px; }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

    /* ── GRID ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
    .span-2 { grid-column: span 2; }

    /* ── TOAST ── */
    #toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; }
    .toast { padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; animation: slideIn 0.2s ease; max-width: 340px; }
    .toast-success { background: #166534; color: #86efac; border: 1px solid #22c55e33; }
    .toast-error   { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef444433; }
    .toast-info    { background: #1e3a5f; color: #93c5fd; border: 1px solid #3b82f633; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ── BADGE ── */
    .badge { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
    .badge-gray   { background: #1e2433; color: #94a3b8; border-color: #2a2d3a; }
    .badge-blue   { background: #1e3a5f; color: #93c5fd; border-color: #3b82f633; }
    .badge-yellow { background: #422006; color: #fcd34d; border-color: #f59e0b33; }
    .badge-green  { background: #14532d; color: #86efac; border-color: #22c55e33; }
    .badge-red    { background: #7f1d1d; color: #fca5a5; border-color: #ef444433; }
    .badge-purple { background: #2e1065; color: #c4b5fd; border-color: #7c3aed33; }

    /* ── SPINNER ── */
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; flex-shrink: 0; }
    .spinner-lg { width: 28px; height: 28px; border-width: 3px; border-color: rgba(255,255,255,0.15); border-top-color: var(--accent); }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── PAGE HEADER ── */
    .page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
    .page-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .page-subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }

    /* ── METRICS ROW ── */
    .metrics-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 24px; }
    .metric-card { text-align: center; padding: 18px 12px; }
    .metric-value { font-size: 26px; font-weight: 700; line-height: 1; margin-bottom: 5px; }
    .metric-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

    /* ── EMPTY STATE ── */
    .empty-state { text-align: center; padding: 64px 24px; color: var(--muted); }
    .empty-icon  { font-size: 44px; margin-bottom: 14px; }
    .empty-text  { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .empty-sub   { font-size: 13px; margin-bottom: 22px; }

    /* ══════════════════════════════════════════
       DASHBOARD
    ══════════════════════════════════════════ */
    .projects-list { display: flex; flex-direction: column; gap: 12px; }
    .project-card { cursor: pointer; transition: border-color 0.15s; }
    .project-card:hover { border-color: var(--accent); }
    .project-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .project-card-name { font-size: 15px; font-weight: 700; }
    .project-card-meta { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
    .project-card-meta span { margin-right: 14px; }
    .scope-chips { display: flex; gap: 7px; flex-wrap: wrap; }
    .scope-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; border: 1px solid rgba(255,255,255,0.06); }

    /* ══════════════════════════════════════════
       NEW PROJECT
    ══════════════════════════════════════════ */
    .np-form { display: flex; flex-direction: column; gap: 22px; max-width: 740px; }
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }

    /* ══════════════════════════════════════════
       PROJECT DETAIL
    ══════════════════════════════════════════ */
    .info-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px 20px; margin-bottom: 24px; }
    .info-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
    .info-value { font-size: 13px; font-weight: 500; line-height: 1.4; }
    .scopes-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; }
    .scope-card { transition: border-color 0.15s; cursor: pointer; }
    .scope-card:hover:not(.scope-pending) { border-color: var(--accent); }
    .scope-pending { opacity: 0.6; cursor: default; }
    .scope-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .scope-card-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .scope-icon { font-size: 20px; line-height: 1; }
    .quote-pills { display: flex; gap: 7px; flex-wrap: wrap; margin: 10px 0; }
    .quote-pill { font-size: 11px; padding: 4px 10px; border-radius: 5px; border: 1px solid var(--border); color: var(--muted); }
    .quote-pill.filled  { color: var(--text); background: #1c2236; }
    .quote-pill.awarded { color: #86efac; background: #14532d40; border-color: #22c55e44; font-weight: 700; }
    .scope-card-footer { margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .pending-msg { font-size: 12px; color: var(--warning); margin-top: 10px; line-height: 1.5; }

    /* ══════════════════════════════════════════
       SCOPE DETAIL
    ══════════════════════════════════════════ */
    .stepper { display: flex; align-items: center; margin-bottom: 22px; }
    .step-node { display: flex; align-items: center; gap: 7px; }
    .step-dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; border: 2px solid var(--border); background: var(--bg); color: var(--muted); flex-shrink: 0; }
    .step-dot.done    { background: var(--success); border-color: var(--success); color: #fff; }
    .step-dot.current { background: var(--accent); border-color: var(--accent); color: #fff; }
    .step-text { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .step-text.done    { color: var(--text); }
    .step-text.current { color: var(--accent); font-weight: 600; }
    .step-line { flex: 1; height: 1px; background: var(--border); min-width: 16px; max-width: 56px; margin: 0 5px; }
    .step-line.done { background: var(--success); }

    .context-box { background: #111420; border: 1px solid var(--border); border-radius: 7px; padding: 14px 16px; margin-bottom: 22px; }
    .context-box-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 10px; }
    .context-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .ctx-item strong { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 2px; }
    .ctx-item { font-size: 12px; }

    .supplier-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
    .sup-tab { padding: 8px 18px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: transparent; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; font-family: var(--font); }
    .sup-tab:hover { color: var(--text); }
    .sup-tab.active { color: var(--text); border-bottom-color: var(--accent); }

    .line-table { width: 100%; border-collapse: collapse; }
    .line-table th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    .line-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .line-table tr:last-child td { border-bottom: none; }
    .li-label { font-size: 12px; line-height: 1.5; }
    .li-optional { color: var(--muted); }
    .li-amt-cell { width: 150px; }
    .li-notes-cell { width: 190px; }
    .amt-input { width: 134px !important; text-align: right; padding: 6px 8px !important; font-size: 13px !important; }
    .notes-input { font-size: 11px !important; padding: 5px 8px !important; }
    .opt-header td { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 14px 10px 5px !important; border-bottom: none !important; background: transparent; }
    .total-row td { background: #111420; font-weight: 700; font-size: 14px; }
    .quote-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 0; }
    .running-total-label { font-size: 13px; color: var(--muted); }
    .running-total-value { font-size: 18px; font-weight: 700; color: var(--accent); }
    .awarded-banner { background: #14532d; border: 1px solid #22c55e44; border-radius: 6px; padding: 9px 14px; font-size: 12px; color: #86efac; margin-bottom: 14px; }

    /* PAYMENT TERMS SECTION */
    .payment-terms-section { margin-top: 20px; padding-top: 16px; border-top: 2px dashed var(--border); }
    .payment-terms-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .payment-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .pt-note { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.5; }

    /* BUDGET GUIDANCE */
    .budget-bar { display: flex; align-items: center; gap: 12px; background: #111420; border: 1px solid var(--border); border-radius: 7px; padding: 12px 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .budget-bar-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .budget-input-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 200px; }
    .budget-input-wrap input { max-width: 160px; }
    .budget-variance { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 5px; }
    .bv-under { background: #14532d40; color: #86efac; border: 1px solid #22c55e44; }
    .bv-over  { background: #7f1d1d40; color: #fca5a5; border: 1px solid #ef444433; }
    .bv-neutral { background: var(--border); color: var(--muted); }

    /* comparison */
    .comp-table { width: 100%; border-collapse: collapse; }
    .comp-table th { font-size: 12px; font-weight: 700; padding: 11px 14px; background: #111420; border: 1px solid var(--border); }
    .comp-table td { padding: 8px 14px; border: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
    .comp-item-col { font-size: 12px; color: var(--muted); width: 36%; }
    .comp-amt { text-align: right; font-weight: 500; }
    .comp-lower { color: #86efac !important; font-weight: 700 !important; }
    .comp-total-row td { font-weight: 700; font-size: 15px; background: #111420; }
    .award-cell { text-align: center; vertical-align: middle; }
    .savings-box { display: flex; justify-content: space-between; align-items: center; background: #0c1e14; border: 1px solid #22c55e44; border-radius: 7px; padding: 14px 18px; margin-top: 16px; }
    .savings-box-label { font-size: 13px; color: var(--muted); }
    .savings-box-pct   { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .savings-box-amt   { font-size: 22px; font-weight: 700; color: var(--success); }
    .market-rate-box { display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
    .market-rate-item { background: #111420; border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; flex: 1; min-width: 140px; }
    .market-rate-item-label { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .market-rate-item-val { font-size: 16px; font-weight: 700; }

    /* ══════════════════════════════════════════
       SAVINGS DASHBOARD
    ══════════════════════════════════════════ */
    .sv-table { width: 100%; border-collapse: collapse; }
    .sv-table th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left; }
    .sv-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
    .sv-table tr:last-child td { border-bottom: none; }
    .sv-right { text-align: right; }
    .sv-green { color: var(--success); font-weight: 700; }
    .sv-muted { color: var(--muted); }

    /* ══════════════════════════════════════════
       MODAL
    ══════════════════════════════════════════ */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 500; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 32px 16px; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; max-width: 860px; width: 100%; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; border-bottom: 1px solid var(--border); }
    .modal-title { font-size: 15px; font-weight: 700; }
    .modal-body { padding: 24px 22px; max-height: 72vh; overflow-y: auto; }
    .modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

    /* ── RFQ DOCUMENT (inside modal, also print-friendly) ── */
    .rfq-doc { font-family: 'Segoe UI', Arial, sans-serif; color: #1a1d27; background: #fff; padding: 0; border-radius: 6px; overflow: hidden; }
    .rfq-doc-header { background: #1a1d27; color: #fff; padding: 20px 28px; display: flex; justify-content: space-between; align-items: flex-start; }
    .rfq-doc-logo { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .rfq-doc-logo span { color: #4f7cff; }
    .rfq-doc-title { font-size: 12px; color: #94a3b8; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.08em; }
    .rfq-doc-meta-right { text-align: right; font-size: 12px; color: #94a3b8; }
    .rfq-doc-meta-right strong { color: #e2e8f0; display: block; font-size: 11px; }
    .rfq-doc-body { padding: 24px 28px; }
    .rfq-section { margin-bottom: 22px; }
    .rfq-section-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #475569; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; margin-bottom: 12px; }
    .rfq-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; }
    .rfq-info-pair { display: flex; gap: 8px; font-size: 12px; }
    .rfq-info-pair .rk { color: #64748b; font-weight: 600; min-width: 110px; flex-shrink: 0; }
    .rfq-info-pair .rv { color: #1a1d27; }
    .rfq-spec-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .rfq-spec-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 5px; padding: 8px 10px; font-size: 11px; }
    .rfq-spec-item strong { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 2px; }
    .rfq-line-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .rfq-line-table th { background: #f1f5f9; color: #475569; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 10px; border: 1px solid #e2e8f0; text-align: left; }
    .rfq-line-table td { padding: 8px 10px; border: 1px solid #e2e8f0; color: #1a1d27; }
    .rfq-line-table tr:nth-child(even) td { background: #fafbfd; }
    .rfq-opt-header td { background: #fff7ed; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: #92400e; border: 1px solid #fed7aa; }
    .rfq-total-row td { background: #f1f5f9; font-weight: 700; }
    .rfq-terms-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 14px 16px; font-size: 12px; color: #475569; }
    .rfq-terms-box p { margin-bottom: 8px; line-height: 1.5; }
    .rfq-terms-box strong { color: #1a1d27; }
    .rfq-sign-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 8px; }
    .rfq-sign-block { border: 1px solid #e2e8f0; border-radius: 6px; padding: 16px; font-size: 12px; }
    .rfq-sign-block .label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .rfq-sign-line { border-bottom: 1px solid #cbd5e1; margin: 20px 0 6px; }
    .rfq-footer { background: #f8fafc; border-top: 1px solid #e2e8f0; padding: 12px 28px; font-size: 11px; color: #64748b; display: flex; justify-content: space-between; }

    @media print {

// ══════════════════════════════════════════════════
// DB HELPER
// ══════════════════════════════════════════════════
async function q(table, op, opts={}) {
  let query = db.from(table);
  if (op === 'select') {
    query = query.select(opts.select||'*');
    if (opts.eq)    query = query.eq(opts.eq[0], opts.eq[1]);
    if (opts.in)    query = query.in(opts.in[0], opts.in[1]);
    if (opts.order) query = query.order(opts.order[0], {ascending: opts.order[1]!==false});
  } else if (op === 'insert') {
    query = query.insert(opts.data);
    if (opts.sel) query = query.select(opts.sel);
  } else if (op === 'update') {
    query = query.update(opts.data).eq(opts.eq[0], opts.eq[1]);
    if (opts.sel) query = query.select(opts.sel);
  } else if (op === 'delete') {
    query = query.delete().eq(opts.eq[0], opts.eq[1]);
  }
  const { data, error } = await query;
  if (error) throw error;
  return data;
}

    const awardedQs    = allQuotes.filter(x=>x.is_awarded);

              <div class="project-card-meta">
                <span>📍 ${esc(p.customer)}</span>
                ${p.jo_numbers?`<span>JO: ${esc(p.jo_numbers)}</span>`:''}
                ${p.pm_name?`<span>PM: ${esc(p.pm_name)}</span>`:''}
                ${p.target_install_date?`<span>🗓 ${fmtDate(p.target_install_date)}</span>`:''}
              </div>
            </div>
          </div>
          <div class="scope-chips">${chips}</div>
        </div>`;
    }).join('');

  } catch(e) {
    document.getElementById('projects-list').innerHTML = `<div class="card" style="color:var(--danger)">Error: ${esc(e.message)}</div>`;
  }
}

// ══════════════════════════════════════════════════
// CREATE PROJECT
// ══════════════════════════════════════════════════
async function createProject() {
  const name     = document.getElementById('np-name').value.trim();
  const customer = document.getElementById('np-customer').value.trim();
  const errEl    = document.getElementById('np-err');
  if (!name || !customer) {
    errEl.textContent = 'Project name and customer are required.';
    errEl.style.display = 'block'; return;
  }
  errEl.style.display = 'none';
  const btn = document.getElementById('np-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Creating…';
  try {
    const [proj] = await q('rfq_projects','insert',{
      data: {
        name, customer,
        jo_numbers:          document.getElementById('np-jo').value.trim()||null,
        target_install_date: document.getElementById('np-date').value||null,
        site_address:        document.getElementById('np-site').value.trim()||null,
        pm_name:             document.getElementById('np-pm').value.trim()||null,
        buyer_name:          document.getElementById('np-buyer').value.trim()||null,
        machine_description: document.getElementById('np-machines').value.trim()||null,
        notes:               document.getElementById('np-notes').value.trim()||null,
      }, sel:'*'
    });
    await q('rfq_scopes','insert',{
      data: SCOPE_ORDER.map(st=>({project_id:proj.id, scope_type:st, status:'draft'}))
    });
    toast(`"${name}" created with 4 scopes`,'success');
    openProject(proj.id, name);
  } catch(e) {
    toast('Error: '+e.message,'error');
    btn.disabled = false;
    btn.textContent = 'Create Project + Auto-generate 4 Scopes';
  }
}

// ══════════════════════════════════════════════════
// PROJECT DETAIL
// ══════════════════════════════════════════════════
async function openProject(projectId, projectName) {
  _projectId   = projectId;
  _projectName = projectName;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-project-detail').classList.add('active');
  setBreadcrumb([{label:'Projects',fn:"showPage('dashboard')"},{label:projectName}]);
  await loadProjectDetail(projectId);
}

async function loadProjectDetail(projectId) {
  const el = document.getElementById('project-detail-content');
  el.innerHTML = `<div class="card empty-state"><div class="spinner spinner-lg" style="margin:0 auto 14px"></div></div>`;
  try {
    const [proj] = await q('rfq_projects','select',{eq:['id',projectId]});
    _projectData = proj;
    const scopes = await q('rfq_scopes','select',{eq:['project_id',projectId]});
    const scopeIds = scopes.map(s=>s.id);
    const quotes = scopeIds.length ? await q('rfq_quotes','select',{in:['scope_id',scopeIds]}) : [];
    const qByScope = {};
    quotes.forEach(x => (qByScope[x.scope_id]||=[]).push(x));

    const infoHtml = [
      {l:'Customer',     v:proj.customer},
      {l:'JO Number(s)', v:proj.jo_numbers||'—'},
      {l:'Site Address', v:proj.site_address||'—'},
      {l:'BEP PM',       v:proj.pm_name||'—'},
      {l:'Buyer',        v:proj.buyer_name||'—'},
      {l:'Target Install',v:fmtDate(proj.target_install_date)},
    ].map(i=>`<div><div class="info-label">${esc(i.l)}</div><div class="info-value">${esc(i.v)}</div></div>`).join('');

    const scopeCards = SCOPE_ORDER.map(st => {
      const scope   = scopes.find(s=>s.scope_type===st);
      const sc      = SCOPES[st];
      const ss      = scope ? (STATUS[scope.status]||STATUS.draft) : STATUS.draft;
      const sq      = scope ? (qByScope[scope.id]||[]) : [];
      const culverQ = sq.find(x=>x.supplier_name==='Culver Development');
      const carnQ   = sq.find(x=>x.supplier_name==='NWI');
      const awardedQ= sq.find(x=>x.is_awarded);

      if (sc.pending) return `
        <div class="card scope-card scope-pending">
          <div class="scope-card-header">
            <div class="scope-card-title"><span class="scope-icon">${sc.icon}</span> ${esc(sc.label)}</div>
            <span class="badge badge-purple">Pending</span>
          </div>
          <div class="pending-msg">⏳ ${esc(sc.pendingNote)}</div>
        </div>`;

      const pillHtml = SUPPLIERS.map(s => {
        const qp = s.id==='culver' ? culverQ : carnQ;
        const cls = qp ? (qp.is_awarded?'awarded':'filled') : '';
        return `<span class="quote-pill ${cls}">${qp&&qp.is_awarded?'✓ ':qp?'● ':'○ '}${esc(s.name)} ${qp&&qp.total_amount?fmt$(qp.total_amount):(qp?'Partial':'—')}</span>`;
      }).join('');

      const budgetHtml = scope&&scope.budget_guidance
        ? `<div style="font-size:11px;color:var(--muted);margin-top:6px">Budget guidance: <strong style="color:var(--warning)">${fmt$(scope.budget_guidance)}</strong></div>`
        : '';

      const quotesWithAmt = sq.filter(x=>x.total_amount>0);
      const compSourcingBadge = quotesWithAmt.length >= 2
        ? `<span style="font-size:10px;font-weight:700;background:rgba(34,197,94,0.12);color:#22c55e;border:1px solid rgba(34,197,94,0.3);border-radius:4px;padding:2px 7px;letter-spacing:0.04em">COMPETED ✓</span>`
        : quotesWithAmt.length === 1
          ? `<span style="font-size:10px;font-weight:700;background:rgba(245,158,11,0.12);color:#f59e0b;border:1px solid rgba(245,158,11,0.3);border-radius:4px;padding:2px 7px;letter-spacing:0.04em">SINGLE SOURCE ⚠</span>`
          : '';

      const scopeIdSafe = scope ? scope.id : '';
      return `
        <div class="card scope-card" onclick="openScope('${scopeIdSafe}','${st}','${safeJs(proj.name)}')">
          <div class="scope-card-header">
            <div class="scope-card-title"><span class="scope-icon">${sc.icon}</span> ${esc(sc.label)}</div>
            <span class="badge ${ss.badge}">${esc(ss.label)}</span>
          </div>
          <div class="quote-pills">${pillHtml}</div>
          ${budgetHtml}
          ${compSourcingBadge ? `<div style="margin-top:8px">${compSourcingBadge}</div>` : ''}
          <div class="scope-card-footer">
            <div style="font-size:13px;font-weight:700;color:var(--success)">${awardedQ?'Awarded: '+fmt$(awardedQ.total_amount):''}</div>
            <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openScope('${scopeIdSafe}','${st}','${safeJs(proj.name)}')">${sq.length?'View Quotes →':'Enter Quotes →'}</button>
          </div>

    }).join('');

    el.innerHTML = `
      <div class="page-header">
        <div>
          <h1>${esc(proj.name)}</h1>

        </div>
        <button class="btn btn-secondary" onclick="showPage('dashboard')">← Projects</button>
      </div>
      <div class="card" style="margin-bottom:20px">
        <div class="info-grid">${infoHtml}</div>
        ${proj.machine_description?`<div style="padding-top:14px;border-top:1px solid var(--border);margin-top:4px"><div class="info-label" style="margin-bottom:4px">Machines</div><div style="font-size:13px;line-height:1.5">${esc(proj.machine_description)}</div></div>`:''}
      </div>
      <div class="scopes-grid">${scopeCards}</div>`;
  } catch(e) {
    el.innerHTML = `<div class="card" style="color:var(--danger)">Error: ${esc(e.message)}</div>`;
  }

// ══════════════════════════════════════════════════
// SCOPE DETAIL
// ══════════════════════════════════════════════════
async function openScope(scopeId, scopeType, projectName) {
  _scopeId   = scopeId;
  _scopeType = scopeType;
  if (projectName) _projectName = projectName;
  _activeTab = 'culver';
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-scope-detail').classList.add('active');
  setBreadcrumb([
    {label:'Projects',fn:"showPage('dashboard')"},
    {label:_projectName||'Project',fn:`openProject('${_projectId}','${safeJs(_projectName||'')}')` },
    {label:SCOPES[scopeType].label},
  ]);
  await loadScopeDetail();
}

async function loadScopeDetail() {
  const el = document.getElementById('scope-detail-content');
  el.innerHTML = `<div class="card empty-state"><div class="spinner spinner-lg" style="margin:0 auto 14px"></div></div>`;
  try {
    const [scope]  = await q('rfq_scopes','select',{eq:['id',_scopeId]});
    const quotes   = await q('rfq_quotes','select',{eq:['scope_id',_scopeId]});
    renderScope(scope, quotes);
  } catch(e) {
    document.getElementById('scope-detail-content').innerHTML = `<div class="card" style="color:var(--danger)">Error: ${esc(e.message)}</div>`;
  }
}

function renderScope(scope, quotes) {
  const sc    = SCOPES[_scopeType];
  const STEPS = ['draft','rfq_sent','quotes_received','awarded'];
  const SLABELS = ['Draft','RFQ Sent','Quotes In','Awarded'];
  const cur   = STEPS.indexOf(scope.status);

  const stepperHtml = STEPS.map((s,i) => {
    const done = cur > i;
    const now  = cur === i;
    return `${i>0?`<div class="step-line ${done?'done':''}"></div>`:''}
    <div class="step-node">
      <div class="step-dot ${done?'done':now?'current':''}">${done?'✓':i+1}</div>
      <span class="step-text ${done?'done':now?'current':''}">${SLABELS[i]}</span>
    </div>`;
  }).join('');

  const ctxHtml = sc.context.length ? `
    <div class="context-box">
      <div class="context-box-title">Scope Context — from RFQ document</div>
      <div class="context-grid">
        ${sc.context.map(c=>`<div class="ctx-item"><strong>${esc(c.l)}</strong>${esc(c.v)}</div>`).join('')}
      </div>
    </div>` : '';

  const culverQ  = quotes.find(x=>x.supplier_name==='Culver Development');
  const carnQ    = quotes.find(x=>x.supplier_name==='NWI');
  const activeQ  = _activeTab==='culver' ? culverQ : carnQ;
  const activeS  = SUPPLIERS.find(s=>s.id===_activeTab);

  const tabsHtml = SUPPLIERS.map(s => {
    const hasQ = s.id==='culver' ? !!culverQ : !!carnQ;
    return `<button class="sup-tab ${_activeTab===s.id?'active':''}" onclick="switchTab('${s.id}')">${esc(s.name)} <span style="font-size:11px;color:var(--muted)">${esc(s.contact)}</span>${hasQ?' ✓':''}</button>`;
  }).join('');

  // Budget guidance bar
  const bg = scope.budget_guidance ? Number(scope.budget_guidance) : null;
  const awardedQ = quotes.find(x=>x.is_awarded);
  let varianceHtml = '';
  if (bg && awardedQ && awardedQ.total_amount) {
    const diff = bg - awardedQ.total_amount;
    const pct  = Math.abs(diff/bg*100).toFixed(1);
    varianceHtml = diff >= 0
      ? `<span class="budget-variance bv-under">▼ ${fmt$(diff)} under budget (${pct}%)</span>`
      : `<span class="budget-variance bv-over">▲ ${fmt$(Math.abs(diff))} over budget (${pct}%)</span>`;
  } else if (bg && culverQ && carnQ) {
    const lowestBid = Math.min(culverQ.total_amount||Infinity, carnQ.total_amount||Infinity);
    const diff = bg - lowestBid;
    const pct  = Math.abs(diff/bg*100).toFixed(1);
    varianceHtml = diff >= 0
      ? `<span class="budget-variance bv-under">Lowest bid ▼ ${fmt$(diff)} under budget (${pct}%)</span>`
      : `<span class="budget-variance bv-over">Lowest bid ▲ ${fmt$(Math.abs(diff))} over budget (${pct}%)</span>`;
  }

  const budgetBarHtml = `
    <div class="budget-bar">
      <div class="budget-bar-label">Budget Guidance</div>
      <div class="budget-input-wrap">
        <span style="color:var(--muted);font-size:13px">$</span>
        <input type="number" id="budget-input" value="${bg||''}" placeholder="Enter BEP budget estimate…"
          style="max-width:180px" min="0" step="1000"
          onkeydown="if(event.key==='Enter')saveBudgetGuidance('${scope.id}',this.value)" />
        <button class="btn btn-secondary btn-sm" onclick="saveBudgetGuidance('${scope.id}',document.getElementById('budget-input').value)">Set</button>
      </div>
      ${varianceHtml}
      <div style="margin-left:auto">
        <button class="btn btn-teal btn-sm" onclick="generateRFQ('${scope.id}')">📄 Generate RFQ Document</button>
      </div>
    </div>`;

  const statusActions = buildStatusActions(scope);
  const quoteForm     = buildQuoteForm(scope, activeQ, activeS);
  const compHtml      = (culverQ && carnQ) ? buildComparison(scope, culverQ, carnQ) :
    `<div style="color:var(--muted);font-size:13px;padding:8px 0">Comparison appears once quotes from both suppliers are saved.</div>`;

  document.getElementById('scope-detail-content').innerHTML = `
    <div class="page-header">
      <div>
        <h1>${sc.icon} ${esc(sc.label)}</h1>
        <div class="page-subtitle">${esc(_projectName||'')}</div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="openProject('${_projectId}','${safeJs(_projectName||'')}')">← Project</button>
    </div>
    <div class="stepper">${stepperHtml}</div>
    ${statusActions}
    ${budgetBarHtml}
    ${ctxHtml}
    <div class="card" style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
        <div style="font-size:14px;font-weight:700">Supplier Quotes</div>
        <div style="font-size:12px;color:var(--muted)">Enter each supplier's quote line by line</div>
      </div>
      <div class="supplier-tabs">${tabsHtml}</div>
      <div id="quote-form">${quoteForm}</div>
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:700;margin-bottom:14px">📊 Quote Comparison</div>
      <div id="comparison">${compHtml}</div>
    </div>`;
}

// ══════════════════════════════════════════════════
// BUDGET GUIDANCE
// ══════════════════════════════════════════════════
async function saveBudgetGuidance(scopeId, val) {
  const num = parseFloat(val);
  if (!num || num <= 0) { toast('Enter a valid budget amount','error'); return; }
  try {
    await q('rfq_scopes','update',{data:{budget_guidance:num},eq:['id',scopeId]});
    toast(`Budget guidance set to ${fmt$(num)}`,'success');
    await loadScopeDetail();
  } catch(e) { toast('Error: '+e.message,'error'); }
}

// ══════════════════════════════════════════════════
// STATUS ACTIONS
// ══════════════════════════════════════════════════
function buildStatusActions(scope) {
  const trans = {
    draft:           {label:'Mark RFQ as Sent →',       next:'rfq_sent',        cls:'btn-primary'},
    rfq_sent:        {label:'Mark Quotes Received →',   next:'quotes_received', cls:'btn-warning'},
    quotes_received: null,
    awarded:         null,
    on_hold:         {label:'Reactivate → Draft',        next:'draft',           cls:'btn-secondary'},
  };
  const t = trans[scope.status];
  const holdBtn = scope.status!=='on_hold'&&scope.status!=='awarded'
    ? `<button class="btn btn-secondary btn-sm" onclick="advanceScope('${scope.id}','on_hold')">⏸ On Hold</button>` : '';
  if (!t) return `<div style="display:flex;gap:8px;margin-bottom:22px;align-items:center">${holdBtn}<span class="badge ${STATUS[scope.status].badge}">${esc(STATUS[scope.status].label)}</span></div>`;
  return `
    <div style="display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;align-items:center">
      <button class="btn ${t.cls} btn-sm" onclick="advanceScope('${scope.id}','${t.next}')">${t.label}</button>
      ${holdBtn}
      <span class="badge ${STATUS[scope.status].badge}">${esc(STATUS[scope.status].label)}</span>
    </div>`;
}

// ══════════════════════════════════════════════════
// QUOTE FORM (with payment terms)
// ══════════════════════════════════════════════════
function buildQuoteForm(scope, existingQ, supplier) {
  const sc    = SCOPES[_scopeType];
  const items = existingQ ? (existingQ.line_items||[]) : [];
  const pt    = existingQ ? (existingQ.payment_terms||{}) : {};
  const getAmt   = k => { const i=items.find(x=>x.key===k); return i&&i.amount?i.amount:''; };
  const getNotes = k => { const i=items.find(x=>x.key===k); return i&&i.notes?esc(i.notes):''; };

  const reqItems = sc.items.filter(i=>i.req);
  const optItems = sc.items.filter(i=>!i.req);

  const rows = reqItems.map(i=>`
    <tr>
      <td class="li-label">${esc(i.label)}</td>
      <td class="li-amt-cell"><input type="number" class="amt-input" id="li-${i.key}" value="${getAmt(i.key)}" placeholder="0" min="0" step="0.01" oninput="calcTotal()" /></td>
      <td class="li-notes-cell"><input type="text" class="notes-input" id="ln-${i.key}" value="${getNotes(i.key)}" placeholder="unit rate, hrs, notes…" /></td>
    </tr>`).join('');

  const optRows = optItems.length ? `
    <tr class="opt-header"><td colspan="3">Optional / Rate Card Items</td></tr>
    ${optItems.map(i=>`
    <tr>
      <td class="li-label li-optional">${esc(i.label)}</td>
      <td class="li-amt-cell"><input type="number" class="amt-input" id="li-${i.key}" value="${getAmt(i.key)}" placeholder="0" min="0" step="0.01" oninput="calcTotal()" /></td>
      <td class="li-notes-cell"><input type="text" class="notes-input" id="ln-${i.key}" value="${getNotes(i.key)}" placeholder="rate…" /></td>
    </tr>`).join('')}` : '';

  const awardedBanner = existingQ&&existingQ.is_awarded ? `<div class="awarded-banner">✓ This quote has been awarded</div>` : '';
  const initTotal = existingQ&&existingQ.total_amount ? fmt$(existingQ.total_amount) : '—';

  // Payment terms section
  const ptOptions = ['Net 30','Net 60','Net 90','2/10 Net 30','Milestone-based','Other'];
  const ptSel = ptOptions.map(o=>`<option value="${o}" ${pt.terms===o?'selected':''}>${o}</option>`).join('');

  const paymentTermsHtml = `
    <div class="payment-terms-section">
      <div class="payment-terms-title">💳 Commercial / Payment Terms</div>
      <div class="payment-grid">
        <div class="form-group">
          <label for="pt-terms">Payment Terms</label>
          <select id="pt-terms">
            <option value="">Select…</option>
            ${ptSel}
          </select>
        </div>
        <div class="form-group">
          <label for="pt-deposit">Deposit Required (%)</label>
          <input type="number" id="pt-deposit" value="${pt.deposit_pct||''}" placeholder="e.g. 30" min="0" max="100" step="5" />
        </div>
        <div class="form-group">
          <label for="pt-submitted">Quote Submitted Date</label>
          <input type="date" id="pt-submitted" value="${existingQ&&existingQ.submitted_date?existingQ.submitted_date:''}" />
        </div>
      </div>
      <div class="payment-grid" style="margin-top:10px">
        <div class="form-group">
          <label for="pt-milestone">Milestone Structure</label>
          <input type="text" id="pt-milestone" value="${esc(pt.milestones||'')}" placeholder="e.g. 30% mobilization / 60% mid / 10% completion" />
        </div>
        <div class="form-group">
          <label for="pt-incoterms">Incoterms</label>
          <select id="pt-incoterms">
            <option value="">Select…</option>
            ${['DDP — Delivered Duty Paid, installed on site','FCA — Free Carrier','EXW — Ex Works','CPT — Carriage Paid To','Other'].map(o=>`<option value="${o}" ${(pt.incoterms||'').startsWith(o.split(' ')[0])?'selected':''}>${o}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label for="pt-validity">Quote Validity Period</label>
          <input type="text" id="pt-validity" value="${esc(pt.validity||'')}" placeholder="e.g. 30 days, 60 days…" />
        </div>
      </div>
      <div class="payment-grid" style="margin-top:10px">
        <div class="form-group span-2" style="grid-column:span 3">
          <label for="pt-notes">Commercial Notes</label>
          <input type="text" id="pt-notes" value="${esc(pt.notes||'')}" placeholder="e.g. Prevailing wage applies, insurance requirements, bonding…" />
        </div>
      </div>
    </div>`;

  return `
    ${awardedBanner}
    <table class="line-table">
      <thead><tr><th>Line Item</th><th style="text-align:right">Amount (USD)</th><th>Notes / Unit Rate</th></tr></thead>
      <tbody>
        ${rows}${optRows}
        <tr class="total-row">
          <td>TOTAL (required items)</td>
          <td style="text-align:right"><span id="running-total" style="color:var(--accent)">${initTotal}</span></td>
          <td></td>
        </tr>
      </tbody>
    </table>
    ${paymentTermsHtml}
    <div class="quote-bar">
      <div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary btn-sm" onclick="clearForm()">Clear</button>
        <button class="btn btn-primary btn-sm" id="save-btn" onclick="saveQuote('${scope.id}','${esc(supplier.name)}')">
          ${existingQ?'Update Quote':'Save Quote'}
        </button>
      </div>
    </div>`;
}

function calcTotal() {
  const sc = SCOPES[_scopeType];
  let total = 0;
  sc.items.filter(i=>i.req).forEach(i => {
    const el = document.getElementById('li-'+i.key);
    if (el && el.value) total += parseFloat(el.value)||0;
  });
  const el = document.getElementById('running-total');
  if (el) el.textContent = total>0 ? fmt$(total) : '—';
}

function clearForm() {
  SCOPES[_scopeType].items.forEach(i => {
    const el = document.getElementById('li-'+i.key);
    const nl = document.getElementById('ln-'+i.key);
    if (el) el.value = '';
    if (nl) nl.value = '';
  });
  calcTotal();
}

function switchTab(id) {
  _activeTab = id;
  loadScopeDetail();
}

async function saveQuote(scopeId, supplierName) {
  const sc = SCOPES[_scopeType];
  const btn = document.getElementById('save-btn');
  if (btn) { btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Saving…'; }
  try {
    const lineItems = sc.items.map(i => {
      const el = document.getElementById('li-'+i.key);
      const nl = document.getElementById('ln-'+i.key);
      return { key:i.key, label:i.label, amount:el?parseFloat(el.value)||0:0, notes:nl?nl.value.trim():'' };
    });
    const total = lineItems.filter(i=>{ const li=sc.items.find(l=>l.key===i.key); return li&&li.req; }).reduce((s,i)=>s+(i.amount||0),0);

    // Collect payment terms
    const paymentTerms = {
      terms:       (document.getElementById('pt-terms')?.value)||'',
      deposit_pct: parseFloat(document.getElementById('pt-deposit')?.value)||null,
      milestones:  (document.getElementById('pt-milestone')?.value||'').trim(),
      incoterms:   (document.getElementById('pt-incoterms')?.value||'').trim(),
      validity:    (document.getElementById('pt-validity')?.value||'').trim(),
      notes:       (document.getElementById('pt-notes')?.value||'').trim(),
    };
    const submittedDate = document.getElementById('pt-submitted')?.value || null;

    const existing = await q('rfq_quotes','select',{eq:['scope_id',scopeId]});
    const prev = existing.find(x=>x.supplier_name===supplierName);
    if (prev) {
      await q('rfq_quotes','update',{data:{line_items:lineItems,total_amount:total,payment_terms:paymentTerms,submitted_date:submittedDate},eq:['id',prev.id]});
    } else {
      const s = SUPPLIERS.find(x=>x.name===supplierName);
      await q('rfq_quotes','insert',{data:{scope_id:scopeId,supplier_name:supplierName,supplier_contact:s?s.contact:null,line_items:lineItems,total_amount:total,payment_terms:paymentTerms,submitted_date:submittedDate}});
    }
    // Auto-advance to quotes_received if both quotes exist and scope is rfq_sent
    const updatedQs = await q('rfq_quotes','select',{eq:['scope_id',scopeId]});
    const [scope]   = await q('rfq_scopes','select',{eq:['id',scopeId]});
    if (updatedQs.length>=2 && scope.status==='rfq_sent') {
      await q('rfq_scopes','update',{data:{status:'quotes_received'},eq:['id',scopeId]});
      toast('Both quotes saved — status auto-advanced to Quotes In','info');
    } else {
      toast(`${supplierName} quote saved`,'success');
    }
    await loadScopeDetail();
  } catch(e) {
    toast('Error: '+e.message,'error');
    if (btn) { btn.disabled=false; btn.textContent='Save Quote'; }
  }
}

async function advanceScope(scopeId, newStatus) {
  try {
    await q('rfq_scopes','update',{data:{status:newStatus},eq:['id',scopeId]});
    toast(`Status → ${STATUS[newStatus].label}`,'info');
    await loadScopeDetail();
  } catch(e) { toast('Error: '+e.message,'error'); }
}

// ══════════════════════════════════════════════════
// COMPARISON (with budget & market rate analysis)
// ══════════════════════════════════════════════════
function buildComparison(scope, culverQ, carnQ) {
  const sc = SCOPES[_scopeType];
  const culverItems = culverQ.line_items||[];
  const carnItems   = carnQ.line_items||[];
  const getAmt = (items,key) => { const i=items.find(x=>x.key===key); return i?(i.amount||0):0; };
  const bg = scope.budget_guidance ? Number(scope.budget_guidance) : null;

  const rows = sc.items.filter(i=>i.req).map(i => {
    const ca = getAmt(culverItems,i.key);
    const cb = getAmt(carnItems,i.key);
    const cLow  = ca>0&&cb>0&&ca<cb;
    const cbLow = ca>0&&cb>0&&cb<ca;
    return `<tr>
      <td class="comp-item-col">${esc(i.label)}</td>
      <td class="comp-amt ${cLow?'comp-lower':''}">${ca>0?fmt$(ca):'—'}</td>
      <td class="comp-amt ${cbLow?'comp-lower':''}">${cb>0?fmt$(cb):'—'}</td>
    </tr>`;
  }).join('');

  const ct  = culverQ.total_amount||0;
  const nct = carnQ.total_amount||0;
  const cLowTotal  = ct>0&&nct>0&&ct<=nct;
  const nLowTotal  = ct>0&&nct>0&&nct<=ct;
  const savings    = ct>0&&nct>0 ? Math.abs(ct-nct) : 0;
  const savingsPct = Math.max(ct,nct)>0 ? (savings/Math.max(ct,nct)*100).toFixed(1) : 0;
  const awarded    = [culverQ,carnQ].find(x=>x.is_awarded);

  const awardBtn = (xq) => {
    if (awarded) return awarded.id===xq.id
      ? `<div style="color:#86efac;font-size:12px;font-weight:700">✓ Awarded</div>`
      : `<div style="color:var(--muted);font-size:11px">Not awarded</div>`;
    return `<button class="btn btn-success btn-xs" onclick="awardQuote('${xq.id}','${scope.id}')">Award →</button>`;
  };

  // Payment terms comparison row
  const culverPT = culverQ.payment_terms||{};
  const carnPT   = carnQ.payment_terms||{};
  const ptRow = (culverPT.terms||carnPT.terms||culverPT.deposit_pct||carnPT.deposit_pct) ? `
    <tr style="border-top:2px solid var(--border)">
      <td class="comp-item-col" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted)">Payment Terms</td>
      <td class="comp-amt" style="font-size:12px;text-align:left">
        ${culverPT.terms?`<div>${esc(culverPT.terms)}</div>`:''}
        ${culverPT.deposit_pct?`<div style="color:var(--muted);font-size:11px">${culverPT.deposit_pct}% deposit</div>`:''}
        ${culverPT.milestones?`<div style="color:var(--muted);font-size:11px">${esc(culverPT.milestones)}</div>`:''}
      </td>
      <td class="comp-amt" style="font-size:12px;text-align:left">
        ${carnPT.terms?`<div>${esc(carnPT.terms)}</div>`:''}
        ${carnPT.deposit_pct?`<div style="color:var(--muted);font-size:11px">${carnPT.deposit_pct}% deposit</div>`:''}
        ${carnPT.milestones?`<div style="color:var(--muted);font-size:11px">${esc(carnPT.milestones)}</div>`:''}
      </td>
    </tr>` : '';

  // Budget variance row
  const budgetRow = bg ? (() => {
    const cDiff = ct>0 ? bg-ct : null;
    const nDiff = nct>0 ? bg-nct : null;
    const vClass = (d) => d===null?'':(d>=0?'style="color:#86efac;font-weight:700"':'style="color:#fca5a5;font-weight:700"');
    const vTxt = (d) => d===null?'—':(d>=0?`▼ ${fmt$(d)} under`:`▲ ${fmt$(Math.abs(d))} over`);
    return `
    <tr style="background:#111420">
      <td class="comp-item-col" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted)">vs. Budget (${fmt$(bg)})</td>
      <td class="comp-amt" ${vClass(cDiff)}>${vTxt(cDiff)}</td>
      <td class="comp-amt" ${vClass(nDiff)}>${vTxt(nDiff)}</td>
    </tr>`;
  })() : '';

  // Market rate analysis
  const marketAvg = ct>0&&nct>0 ? (ct+nct)/2 : null;
  const marketHigh = ct>0&&nct>0 ? Math.max(ct,nct) : null;
  const marketLow  = ct>0&&nct>0 ? Math.min(ct,nct) : null;

  const marketRateHtml = marketAvg ? `
    <div class="market-rate-box">
      <div class="market-rate-item">
        <div class="market-rate-item-label">Market Low</div>
        <div class="market-rate-item-val" style="color:var(--success)">${fmt$(marketLow)}</div>
      </div>
      <div class="market-rate-item">
        <div class="market-rate-item-label">Market Defensible Position</div>
        <div class="market-rate-item-val" style="color:var(--warning)">${fmt$(marketAvg)}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:3px">Blended avg — use for customer pricing</div>
      </div>
      <div class="market-rate-item">
        <div class="market-rate-item-label">Market High</div>
        <div class="market-rate-item-val" style="color:var(--muted)">${fmt$(marketHigh)}</div>
      </div>
      ${bg?`<div class="market-rate-item" style="border-color:var(--accent)">
        <div class="market-rate-item-label" style="color:var(--accent)">Budget Guidance</div>
        <div class="market-rate-item-val" style="color:var(--accent)">${fmt$(bg)}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:3px">BEP internal estimate</div>
      </div>`:''}
    </div>` : '';

  const bothQuoted = ct > 0 && nct > 0;
  const compSourcingBanner = bothQuoted
    ? `<div style="display:flex;align-items:center;gap:10px;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);border-radius:8px;padding:10px 16px;margin-bottom:14px">
        <span style="font-size:16px">✅</span>
        <div>
          <div style="font-size:11px;font-weight:700;color:#22c55e;text-transform:uppercase;letter-spacing:0.06em">Competed — 2 Quotes Received</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">Scope is competitively sourced. Pricing reflects market defensible position.</div>
        </div>
      </div>`
    : ct > 0 || nct > 0
      ? `<div style="display:flex;align-items:center;gap:10px;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);border-radius:8px;padding:10px 16px;margin-bottom:14px">
          <span style="font-size:16px">⚠️</span>
          <div>
            <div style="font-size:11px;font-weight:700;color:#f59e0b;text-transform:uppercase;letter-spacing:0.06em">Single Source — 1 Quote Only</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">Scope is not competed. Obtain a second quote to establish a market defensible position.</div>
          </div>
        </div>`
      : '';

  return `
    ${compSourcingBanner}
    <table class="comp-table">
      <thead>
        <tr>
          <th class="comp-item-col">Line Item</th>
          <th style="text-align:right">Culver Development<br><small style="font-weight:400;color:var(--muted)">Scott Culver</small></th>
          <th style="text-align:right">NWI<br><small style="font-weight:400;color:var(--muted)">Contact TBD</small></th>
        </tr>
      </thead>
      <tbody>
        ${rows}
        <tr class="comp-total-row">
          <td><strong>TOTAL</strong></td>
          <td class="comp-amt ${cLowTotal?'comp-lower':''}">
            <div>${fmt$(ct)}</div>
            <div style="margin-top:8px">${awardBtn(culverQ)}</div>
          </td>
          <td class="comp-amt ${nLowTotal?'comp-lower':''}">
            <div>${fmt$(nct)}</div>
            <div style="margin-top:8px">${awardBtn(carnQ)}</div>
          </td>
        </tr>
        ${budgetRow}
        ${ptRow}
      </tbody>
    </table>
    ${savings>0?`
    <div class="savings-box">
      <div>
        <div class="savings-box-label">Competitive savings — lower bid vs. higher bid</div>
        <div class="savings-box-pct">${savingsPct}% saved by awarding to lower bidder</div>
      </div>
      <div class="savings-box-amt">${fmt$(savings)}</div>
    </div>`:''}
    ${marketRateHtml}
    ${(()=>{
      const lowestQ = marketLow;
      const headroom = marketAvg && lowestQ ? marketAvg - lowestQ : null;
      const headroomPct = headroom && marketAvg ? ((headroom/marketAvg)*100).toFixed(1) : null;
      const awardedAmt  = awarded ? (awarded.total_amount||0) : 0;
      const profitProtect = awardedAmt > 0 ? awardedAmt * 0.02 : null;

      if (!headroom && !profitProtect) return '';
      return `
    <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap">
      ${headroom ? `
      <div style="flex:1;min-width:200px;background:#0d1117;border:1px solid #1e2535;border-radius:8px;padding:14px 18px">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:6px">Negotiation Headroom</div>
        <div style="font-size:22px;font-weight:700;color:#38bdf8">${fmt$(headroom)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">${headroomPct}% gap — room to push market defensible position down to low bid</div>
      </div>` : ''}
      ${profitProtect ? `
      <div style="flex:1;min-width:200px;background:#0d1117;border:1px solid rgba(168,85,247,0.35);border-radius:8px;padding:14px 18px">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:6px">Profit Protection (2% BEP Policy)</div>
        <div style="font-size:22px;font-weight:700;color:#a855f7">${fmt$(profitProtect)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">Push supplier ${fmt$(profitProtect)} below awarded total to protect BEP margin</div>
      </div>` : ''}
    </div>`;
    })()}`;
}

async function awardQuote(quoteId, scopeId) {
  try {
    const all = await q('rfq_quotes','select',{eq:['scope_id',scopeId]});
    for (const x of all) await q('rfq_quotes','update',{data:{is_awarded:false},eq:['id',x.id]});
    await q('rfq_quotes','update',{data:{is_awarded:true},eq:['id',quoteId]});
    await q('rfq_scopes','update',{data:{status:'awarded'},eq:['id',scopeId]});
    toast('Quote awarded! Scope marked Awarded.','success');
    await loadScopeDetail();
  } catch(e) { toast('Error: '+e.message,'error'); }
}

}

async function loadSavings() {
  try {
    const projects = await q('rfq_projects','select',{order:['created_at',false]});
    const scopes   = await q('rfq_scopes','select');
    const quotes   = await q('rfq_quotes','select');

    const awardedQs    = quotes.filter(x=>x.is_awarded);
    const totalAwarded = awardedQs.reduce((s,x)=>s+(x.total_amount||0),0);
    const compared     = scopes.filter(s=>{const sq=quotes.filter(x=>x.scope_id===s.id);return sq.length>=2;});
    const totalSavings = compared.reduce((sum,s)=>{
      const sq = quotes.filter(x=>x.scope_id===s.id).map(x=>x.total_amount||0).filter(a=>a>0);
      return sq.length>=2 ? sum+(Math.max(...sq)-Math.min(...sq)) : sum;
    },0);

    // Budget vs awarded
    const budgetedScopes = scopes.filter(s=>s.budget_guidance&&awardedQs.some(q=>q.scope_id===s.id));
    const totalBudgeted  = budgetedScopes.reduce((s,x)=>s+(x.budget_guidance||0),0);
    const totalAwardedBudgeted = budgetedScopes.reduce((sum,s)=>{
      const aw = awardedQs.find(q=>q.scope_id===s.id);
      return sum + (aw?aw.total_amount||0:0);
    },0);
    const budgetVariance = totalBudgeted - totalAwardedBudgeted;

    document.getElementById('savings-metrics').innerHTML = `
      <div class="card metric-card"><div class="metric-value" style="color:var(--success);font-size:${totalAwarded>0?'18':'26'}px">${fmt$(totalAwarded)}</div><div class="metric-label">Total Awarded</div></div>
      <div class="card metric-card"><div class="metric-value" style="color:var(--success);font-size:${totalSavings>0?'18':'26'}px">${fmt$(totalSavings)}</div><div class="metric-label">Competitive Savings</div></div>
      <div class="card metric-card"><div class="metric-value" style="color:${budgetVariance>=0?'var(--success)':'var(--danger)'};font-size:${Math.abs(budgetVariance)>0?'18':'26'}px">${budgetVariance!==0?(budgetVariance>0?'▼ ':'▲ ')+fmt$(Math.abs(budgetVariance)):'—'}</div><div class="metric-label">vs. Budget Guidance</div></div>
      <div class="card metric-card"><div class="metric-value" style="color:var(--warning)">${compared.length}</div><div class="metric-label">Scopes Compared</div></div>
    `;

    if (!quotes.length) {
      document.getElementById('savings-content').innerHTML = `
        <div class="card empty-state">
          <div class="empty-icon">💰</div>
          <div class="empty-text">No quotes yet</div>
          <div class="empty-sub">Enter quotes from both suppliers to see competitive savings</div>
        </div>`;
      return;
    }

    const rows = projects.map(p => {
      const ps = scopes.filter(s=>s.project_id===p.id);
      const pq = quotes.filter(x=>ps.some(s=>s.id===x.scope_id));
      if (!pq.length) return '';
      const tableRows = SCOPE_ORDER.map(st => {
        const scope = ps.find(s=>s.scope_type===st);
        if (!scope) return '';
        const sq = pq.filter(x=>x.scope_id===scope.id);
        if (!sq.length) return '';
        const sc = SCOPES[st];
        const aw = sq.find(x=>x.is_awarded);
        const amts = sq.map(x=>x.total_amount||0).filter(a=>a>0);
        const sav = amts.length>=2 ? Math.max(...amts)-Math.min(...amts) : 0;
        const savPct = amts.length>=2 ? (sav/Math.max(...amts)*100).toFixed(1) : null;
        const cq = sq.find(x=>x.supplier_name==='Culver Development');
        const nq = sq.find(x=>x.supplier_name==='NWI');
        const bg = scope.budget_guidance ? Number(scope.budget_guidance) : null;
        const bvAmt = bg && aw ? bg - (aw.total_amount||0) : null;
        const bvHtml = bvAmt!==null
          ? `<span style="font-size:11px;font-weight:700;color:${bvAmt>=0?'#86efac':'#fca5a5'}">${bvAmt>=0?'▼':'▲'} ${fmt$(Math.abs(bvAmt))}</span>`
          : '<span class="sv-muted">—</span>';
        return `<tr>
          <td>${sc.icon} ${esc(sc.label)}</td>
          <td class="sv-right">${cq?fmt$(cq.total_amount):'<span class="sv-muted">—</span>'}</td>
          <td class="sv-right">${nq?fmt$(nq.total_amount):'<span class="sv-muted">—</span>'}</td>
          <td class="sv-right ${aw?'sv-green':''}">${aw?fmt$(aw.total_amount):'<span class="sv-muted">—</span>'}</td>
          <td class="sv-right">${bg?fmt$(bg):'<span class="sv-muted">—</span>'}</td>
          <td class="sv-right">${bvHtml}</td>
          <td class="sv-right ${sav>0?'sv-green':''}">${sav>0?fmt$(sav)+(savPct?` <span style="font-size:11px;opacity:0.7">(${savPct}%)</span>`:''):'<span class="sv-muted">—</span>'}</td>
        </tr>`;
      }).filter(Boolean).join('');
      if (!tableRows) return '';
      const projTotal = pq.filter(x=>x.is_awarded).reduce((s,x)=>s+(x.total_amount||0),0);
      return `
        <div class="card" style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
            <div style="font-size:15px;font-weight:700">${esc(p.name)}</div>
            ${projTotal?`<div style="font-size:13px;font-weight:700;color:var(--success)">${fmt$(projTotal)} awarded</div>`:''}
          </div>
          <table class="sv-table">
            <thead><tr>
              <th>Scope</th>
              <th class="sv-right">Culver Dev.</th>
              <th class="sv-right">NWI</th>
              <th class="sv-right">Awarded</th>
              <th class="sv-right">Budget</th>
              <th class="sv-right">vs. Budget</th>
              <th class="sv-right">Comp. Savings</th>
            </tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>`;
    }).filter(Boolean).join('');

    document.getElementById('savings-content').innerHTML = rows ||
      `<div class="card" style="color:var(--muted);text-align:center;padding:48px">No comparative data yet. Enter quotes for both suppliers to see savings.</div>`;
  } catch(e) {
    document.getElementById('savings-content').innerHTML = `<div class="card" style="color:var(--danger)">Error: ${esc(e.message)}</div>`;
  }
}

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════
loadDashboard();
</script>
